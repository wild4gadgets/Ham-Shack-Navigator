<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ham Shack Cockpit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <nav class="navbar navbar-dark bg-dark" id="navbar" style="display:none">
    <div class="container-fluid d-flex align-items-center">
      <a class="navbar-brand" href="#/dashboard">
        <i class="bi bi-broadcast-pin me-2"></i>Ham Shack Cockpit
      </a>

      <!-- Centered clocks -->
      <div class="flex-grow-1 d-flex justify-content-center align-items-center gap-4">
        <div class="seg-clock-group">
          <div class="seg-clock" id="clock-local-display"></div>
          <div class="seg-clock-label">Local</div>
        </div>
        <div class="seg-clock-group">
          <div class="seg-clock" id="clock-utc-display"></div>
          <div class="seg-clock-label">UTC</div>
        </div>
      </div>

      <!-- Right nav -->
      <div class="d-flex gap-2 align-items-center">
<a href="#/dashboard" class="nav-pill badge rounded-pill bg-secondary">Dashboard</a>
        <a href="#/workflows" class="nav-pill badge rounded-pill bg-secondary">Workflows</a>
        <a href="#/settings" class="nav-pill badge rounded-pill bg-secondary">Settings</a>
        <a href="#/events" class="nav-pill badge rounded-pill bg-secondary">Events</a>
        <button id="logout-btn" class="nav-pill badge rounded-pill bg-danger border-0">Logout</button>
      </div>
    </div>
  </nav>

  <div id="app" class="container-fluid mt-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
