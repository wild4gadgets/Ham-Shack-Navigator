services:
  app:
    build: ./app
    container_name: ham-shack-cockpit-app
    restart: unless-stopped
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=sqlite+aiosqlite:////data/shack_weather.db
      - TZ=${TZ:-America/Denver}
    volumes:
      - ./data:/data
      - ./app/static:/app/static:ro
    ports:
      - "4991:4991/udp"
    networks:
      - internal
    expose:
      - "8000"

  nginx:
    build: ./nginx
    container_name: ham-shack-cockpit-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "5000:5000"
    volumes:
      - ./ssl:/etc/ssl/ham-shack-cockpit
    environment:
      - APP_HOST=app
      - APP_PORT=8000
    depends_on:
      - app
    networks:
      - internal

networks:
  internal:
    driver: bridge
